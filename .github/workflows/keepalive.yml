# Render's free tier puts the agent to sleep after ~15 idle minutes, and waking it takes
# about a minute: too slow for a client opening a pay link. Ping it every 10 minutes.
# Set the repository variable FACTURA_AGENT_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep the agent awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.FACTURA_AGENT_URL != '' }}
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 "${{ vars.FACTURA_AGENT_URL }}/health"
